name: Deploy WebGL to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "autoload/**"
      - "scenes/**"
      - "scripts/**"
      - "assets/**"
      - "project.godot"
      - "export_presets.cfg"
      - "icon.svg*"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_TEMPLATES_DIR_NAME: "4.7.2.stable"

jobs:
  build:
    name: Exportar Godot WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Cache do Godot e templates Web
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR_NAME }}
            ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-web-v1

      - name: Baixar Godot ${{ env.GODOT_VERSION }} e templates Web
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin "$HOME/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR_NAME }}"
          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/godot-bin
          chmod +x ~/godot-bin/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64
          rm -f /tmp/godot.zip

          curl -fsSL "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz "templates/web_*" "templates/version.txt" -d "$HOME/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR_NAME }}"
          rm -f /tmp/templates.tpz

      - name: Importar projeto, smoke test e exportar preset Web
        run: |
          GODOT_BIN="$HOME/godot-bin/Godot_v${{ env.GODOT_VERSION }}_linux.x86_64"
          mkdir -p build/web
          "$GODOT_BIN" --headless --path . --import
          "$GODOT_BIN" --headless --path . --quit-after 3
          "$GODOT_BIN" --headless --path . --export-release "Web" build/web/index.html
          touch build/web/.nojekyll
          ls -lh build/web

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato do build WebGL
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publicar no GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
